<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2: Portal de Admisión y Registro de Estudiantes</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Ajuste para imitar el cuadro punteado del boceto si se requiere visualizar el contenedor */
        .boceto-container {
            border: 2px dashed #a0a0a0;
            padding: 20px;
            background-color: #ffffff;
        }
    </style>
</head>
<body class="p-4 bg-light">

    <!-- Contenedor general que simula el resultado plasmado gráficamente -->
    <div class="container boceto-container">
        
        <!-- Bloque de información superior e introducción -->
        <div class="mb-3">
            <p class="text-secondary mb-1">📝 Admisiones 2026</p>
            <h3 class="fw-normal mb-2">Inscripciones Abiertas</h3>
            <h5 class="fw-bold mb-3" style="color: #4a5568;">Forma Parte de la Comunidad Académica</h5>
            <hr class="my-3">
            <p class="text-secondary small mb-3">
                Completa el formulario oficial de postulación. Nuestro equipo de admisiones se pondrá en contacto para validar tu documentación.
            </p>
            <p class="text-secondary small mb-4">
                <span class="text-success">✓</span> Requisitos: Fotocopia de Cédula y Título de Bachiller.
            </p>
        </div>

        <!-- Formulario de Registro idéntico al esquema de la imagen -->
        <div class="row">
            <div class="col-12 col-md-6 col-lg-5">
                <h5 class="fw-normal mb-3">Formulario de Registro</h5>
                <form action="#" method="POST">
                    
                    <!-- Campo: Nombre Completo -->
                    <div class="mb-2">
                        <label for="nombreCompleto" class="form-label small mb-1">Nombre Completo:</label>
                        <input type="text" class="form-control form-control-sm" id="nombreCompleto" placeholder="Ej. Ana Pérez">
                    </div>

                    <!-- Campo: Correo Electrónico -->
                    <div class="mb-2">
                        <label for="correo" class="form-label small mb-1">Correo Electrónico:</label>
                        <input type="email" class="form-control form-control-sm" id="correo" placeholder="ana@ejemplo.com">
                    </div>

                    <!-- Desplegable: Carrera de Interés -->
                    <div class="mb-3">
                        <label for="carrera" class="form-label small mb-1">Carrera de Interés:</label>
                        <select class="form-select form-select-sm" id="carrera">
                            <option value="" selected>Seleccione una carrera...</option>
                            <option value="1">Desarrollo de Software</option>
                            <option value="2">Sistemas y Redes</option>
                            <option value="3">Diseño UI/UX Digital</option>
                        </select>
                    </div>

                    <!-- Botón de Envío -->
                    <button type="submit" class="btn btn-outline-secondary btn-sm">Enviar Postulación</button>
                </form>
            </div>
        </div>

    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
